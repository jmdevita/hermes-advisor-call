name: ci

# Not active: GitHub only runs workflows under .github/workflows/.
# To turn CI on, move this file to .github/workflows/ci.yml.
# Until then, scripts/ci.sh runs the same checks locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: python -m pip install "pytest>=8" "ruff>=0.6"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: python -m pytest
